<template id="transactions" data-group="Beyond the basics" data-title="Transactions & change streams">
<p class="lead">Multi-document transactions make several writes succeed or fail together. They need a replica set or sharded cluster (Atlas clusters qualify).</p>
<h2>Transaction in mongosh</h2>
<pre class="code">const session = db.getMongo().startSession()
const shop = session.getDatabase("shop")

session.startTransaction({ readConcern: { level: "snapshot" }, writeConcern: { w: "majority" } })
try {
  shop.orders.insertOne({ _id: 108, customerId: "c2", status: "pending",
                          items: [ { productId: 6, qty: 1, price: 199 } ], total: 199 })
  const r = shop.products.updateOne({ _id: 6, stock: { $gte: 1 } }, { $inc: { stock: -1 } })
  if (r.modifiedCount === 0) throw new Error("Out of stock")
  session.commitTransaction()
  print("Order placed")
} catch (e) {
  session.abortTransaction()
  print("Rolled back: " + e.message)
} finally {
  session.endSession()
}</pre>
<h2>Node.js driver equivalent</h2>
<pre class="code">const session = client.startSession()
try {
  await session.withTransaction(async () =&gt; {
    await orders.insertOne({ _id: 108, customerId: "c2", total: 199 }, { session })
    await products.updateOne({ _id: 6 }, { $inc: { stock: -1 } }, { session })
  })
} finally {
  await session.endSession()
}</pre>
<div class="note"><p>Keep transactions short (under 60 seconds by default). If you can design the data so a change touches one document, you don't need a transaction at all.</p></div>
<h2>Change streams</h2>
<p>Watch a collection for real-time inserts, updates and deletes.</p>
<pre class="code">const stream = db.orders.watch([
  { $match: { operationType: { $in: ["insert", "update"] } } }
], { fullDocument: "updateLookup" })

while (!stream.isClosed()) {
  const change = stream.tryNext()
  if (change) printjson(change)
}</pre>
<h2>Read and write concerns at a glance</h2>
<div class="tbl"><table>
<tr><th>Setting</th><th>Common values</th><th>Meaning</th></tr>
<tr><td>writeConcern <code>w</code></td><td><code>1</code>, <code>"majority"</code></td><td>How many members confirm a write</td></tr>
<tr><td>readConcern</td><td><code>"local"</code>, <code>"majority"</code>, <code>"snapshot"</code></td><td>How committed the data you read must be</td></tr>
<tr><td>readPreference</td><td><code>primary</code>, <code>secondaryPreferred</code>, <code>nearest</code></td><td>Which member serves reads</td></tr>
</table></div>
</template>

<template id="cheatsheet" data-group="Beyond the basics" data-title="SQL to MongoDB cheat sheet">
<p class="lead">If you know SQL, this table maps common statements to their MongoDB equivalents.</p>
<div class="tbl"><table>
<tr><th>SQL</th><th>MongoDB</th></tr>
<tr><td><code>SELECT * FROM products</code></td><td><code>db.products.find()</code></td></tr>
<tr><td><code>SELECT name, price FROM products</code></td><td><code>db.products.find({}, { name: 1, price: 1, _id: 0 })</code></td></tr>
<tr><td><code>WHERE price &gt; 100</code></td><td><code>find({ price: { $gt: 100 } })</code></td></tr>
<tr><td><code>WHERE a = 1 AND b = 2</code></td><td><code>find({ a: 1, b: 2 })</code></td></tr>
<tr><td><code>WHERE a = 1 OR b = 2</code></td><td><code>find({ $or: [ { a: 1 }, { b: 2 } ] })</code></td></tr>
<tr><td><code>WHERE city IN ('Dubai','Milan')</code></td><td><code>find({ city: { $in: ["Dubai", "Milan"] } })</code></td></tr>
<tr><td><code>WHERE name LIKE 'Co%'</code></td><td><code>find({ name: /^Co/ })</code></td></tr>
<tr><td><code>WHERE email IS NULL</code></td><td><code>find({ email: null })</code></td></tr>
<tr><td><code>ORDER BY price DESC LIMIT 5</code></td><td><code>find().sort({ price: -1 }).limit(5)</code></td></tr>
<tr><td><code>LIMIT 10 OFFSET 20</code></td><td><code>find().skip(20).limit(10)</code></td></tr>
<tr><td><code>SELECT COUNT(*)</code></td><td><code>countDocuments({})</code></td></tr>
<tr><td><code>SELECT DISTINCT category</code></td><td><code>distinct("category")</code></td></tr>
<tr><td><code>GROUP BY category</code> with <code>SUM</code></td><td><code>aggregate([ { $group: { _id: "$category", s: { $sum: "$price" } } } ])</code></td></tr>
<tr><td><code>HAVING COUNT(*) &gt; 1</code></td><td><code>$group</code> then <code>{ $match: { count: { $gt: 1 } } }</code></td></tr>
<tr><td><code>INNER JOIN customers ON ...</code></td><td><code>$lookup</code> then <code>$unwind</code></td></tr>
<tr><td><code>LEFT JOIN</code></td><td><code>$lookup</code> then <code>$unwind</code> with <code>preserveNullAndEmptyArrays: true</code></td></tr>
<tr><td><code>UNION ALL</code></td><td><code>$unionWith</code></td></tr>
<tr><td><code>CASE WHEN ... END</code></td><td><code>$cond</code> or <code>$switch</code></td></tr>
<tr><td><code>COALESCE(a, b)</code></td><td><code>$ifNull: ["$a", "$b"]</code></td></tr>
<tr><td><code>ROW_NUMBER() OVER (...)</code></td><td><code>$setWindowFields</code> with <code>$documentNumber</code></td></tr>
<tr><td><code>INSERT INTO ... VALUES</code></td><td><code>insertOne()</code> / <code>insertMany()</code></td></tr>
<tr><td><code>UPDATE ... SET x = 1 WHERE ...</code></td><td><code>updateMany(filter, { $set: { x: 1 } })</code></td></tr>
<tr><td><code>UPDATE ... SET n = n + 1</code></td><td><code>{ $inc: { n: 1 } }</code></td></tr>
<tr><td><code>DELETE FROM ... WHERE ...</code></td><td><code>deleteMany(filter)</code></td></tr>
<tr><td><code>TRUNCATE TABLE</code></td><td><code>deleteMany({})</code></td></tr>
<tr><td><code>DROP TABLE</code></td><td><code>drop()</code></td></tr>
<tr><td><code>CREATE INDEX</code></td><td><code>createIndex({ field: 1 })</code></td></tr>
<tr><td><code>CREATE TABLE ... AS SELECT</code></td><td><code>aggregate([..., { $out: "newColl" }])</code></td></tr>
</table></div>
<h2>Operator families at a glance</h2>
<div class="tbl"><table>
<tr><th>Family</th><th>Operators</th></tr>
<tr><td>Query: comparison</td><td><code>$eq $ne $gt $gte $lt $lte $in $nin</code></td></tr>
<tr><td>Query: logical</td><td><code>$and $or $nor $not</code></td></tr>
<tr><td>Query: element / eval</td><td><code>$exists $type $regex $expr $mod $text $jsonSchema $where</code></td></tr>
<tr><td>Query: array</td><td><code>$all $elemMatch $size</code></td></tr>
<tr><td>Update: fields</td><td><code>$set $unset $inc $mul $rename $min $max $currentDate $setOnInsert</code></td></tr>
<tr><td>Update: arrays</td><td><code>$push $addToSet $pop $pull $pullAll $each $position $slice $sort $ $[] $[id]</code></td></tr>
</table></div>
</template>

<template id="practice" data-group="Beyond the basics" data-title="Practice exercises">
<p class="lead">Try each problem against the sample dataset before opening the solution. Reset the data first if you changed it on earlier pages.</p>
<h2>Queries</h2>
<details><summary>1. Find wireless products under 100, showing only name and price.</summary>
<pre class="code">db.products.find(
  { tags: "wireless", price: { $lt: 100 } },
  { _id: 0, name: 1, price: 1 }
)</pre>
<pre class="out">{ name: 'Wireless Mouse', price: 29 }</pre></details>
<details><summary>2. Find orders that include more than one unit of any product.</summary>
<pre class="code">db.orders.find({ "items.qty": { $gt: 1 } }, { _id: 1 })</pre>
<pre class="out">101, 102, 104</pre></details>
<details><summary>3. Find products with at least one rating of 3 or lower.</summary>
<pre class="code">db.products.find({ ratings: { $lte: 3 } }, { name: 1 })</pre>
<pre class="out">Coffee Beans 1kg, Desk Lamp, Wireless Mouse</pre></details>
<h2>Updates</h2>
<details><summary>4. Add the tag "sale" to every electronics product without creating duplicates.</summary>
<pre class="code">db.products.updateMany({ category: "electronics" }, { $addToSet: { tags: "sale" } })</pre></details>
<details><summary>5. In order 106, set the qty of product 5 to 3 and recompute the order total.</summary>
<pre class="code">db.orders.updateOne({ _id: 106, "items.productId": 5 }, { $set: { "items.$.qty": 3 } })
db.orders.updateOne({ _id: 106 }, [
  { $set: { total: { $sum: { $map: { input: "$items", in: { $multiply: ["$$this.qty", "$$this.price"] } } } } } }
])</pre>
<pre class="out">total becomes 249 + 87 = 336</pre></details>
<h2>Aggregation</h2>
<details><summary>6. Revenue per city (join orders to customers, ignore cancelled).</summary>
<pre class="code">db.orders.aggregate([
  { $match: { status: { $ne: "cancelled" } } },
  { $lookup: { from: "customers", localField: "customerId", foreignField: "_id", as: "c" } },
  { $unwind: "$c" },
  { $group: { _id: "$c.city", revenue: { $sum: "$total" } } },
  { $sort: { revenue: -1 } }
])</pre>
<pre class="out">{ _id: 'Dubai', revenue: 484 }
{ _id: 'Seoul', revenue: 421 }
{ _id: 'Milan', revenue: 58 }</pre></details>
<details><summary>7. Sales by product category, using product names from the products collection.</summary>
<pre class="code">db.orders.aggregate([
  { $match: { status: { $ne: "cancelled" } } },
  { $unwind: "$items" },
  { $lookup: { from: "products", localField: "items.productId", foreignField: "_id", as: "p" } },
  { $unwind: "$p" },
  { $group: { _id: "$p.category", sales: { $sum: { $multiply: ["$items.qty", "$items.price"] } } } },
  { $sort: { sales: -1 } }
])</pre>
<pre class="out">{ _id: 'kitchen', sales: 587 }
{ _id: 'electronics', sales: 286 }
{ _id: 'grocery', sales: 90 }</pre></details>
<details><summary>8. For each customer, show their name, number of orders and their most recent order date. Include customers with no orders.</summary>
<pre class="code">db.customers.aggregate([
  { $lookup: { from: "orders", localField: "_id", foreignField: "customerId", as: "o" } },
  { $project: {
      _id: 0, name: 1,
      orders: { $size: "$o" },
      lastOrder: { $max: "$o.date" }
  } },
  { $sort: { orders: -1, name: 1 } }
])</pre>
<pre class="out">{ name: 'Aisha Khan',  orders: 2, lastOrder: ISODate('2026-02-02') }
{ name: 'Lena Park',   orders: 2, lastOrder: ISODate('2026-03-09') }
{ name: 'Marco Rossi', orders: 1, lastOrder: ISODate('2026-01-18') }
{ name: 'Omar Haddad', orders: 1, lastOrder: ISODate('2026-03-01') }</pre></details>
<details><summary>9. List the two highest-rated products (by average rating) with their average rounded to 1 decimal.</summary>
<pre class="code">db.products.aggregate([
  { $set: { avg: { $avg: "$ratings" } } },
  { $sort: { avg: -1 } },
  { $limit: 2 },
  { $project: { _id: 0, name: 1, avg: { $round: ["$avg", 1] } } }
])</pre>
<pre class="out">{ name: 'Chef Knife', avg: 4.8 }
{ name: 'Espresso Machine', avg: 4.7 }</pre></details>
<div class="note"><p>Next steps: the official manual at <a href="https://www.mongodb.com/docs/manual/" target="_blank" rel="noopener">mongodb.com/docs/manual</a> has the full operator reference, and MongoDB University offers free courses.</p></div>
</template>

<script>
(function(){
  const tpls = [...document.querySelectorAll("template[id]")];
  const pages = tpls.map((t, i) => ({ id: t.id, title: t.dataset.title, group: t.dataset.group, tpl: t, n: i + 1,
    text: (t.dataset.title + " " + t.content.textContent).toLowerCase() }));
  const nav = document.getElementById("nav"), page = document.getElementById("page"),
        q = document.getElementById("q"), side = document.getElementById("side"), toggle = document.getElementById("toggle");

  const KW = new Set(["db","true","false","null","const","let","new","return","function","try","catch","finally","if","throw","await","async","while","use","show","print","printjson"]);
  const TYPES = new Set(["ISODate","ObjectId","NumberDecimal","NumberLong","Date","Error"]);
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function hl(src){
    const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\$\$?[A-Za-z_][\w]*(?:\[[^\]]*\])?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      const s = m[0];
      if (m[1]) out += '<span class="t-com">' + esc(s) + "</span>";
      else if (m[2]) out += '<span class="' + (/^["']\$/.test(s) ? "t-field" : "t-str") + '">' + esc(s) + "</span>";
      else if (m[3]) out += '<span class="t-op">' + esc(s) + "</span>";
      else if (m[4]) out += '<span class="t-num">' + s + "</span>";
      else {
        const prev = src[m.index - 1], next = src.slice(re.lastIndex).match(/^\s*\(/);
        if (KW.has(s)) out += '<span class="t-kw">' + s + "</span>";
        else if (TYPES.has(s)) out += '<span class="t-fn">' + s + "</span>";
        else if (prev === "." && next) out += '<span class="t-fn">' + s + "</span>";
        else out += s;
      }
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function buildNav(filter){
    const f = (filter || "").trim().toLowerCase();
    const shown = pages.filter(p => !f || p.text.includes(f));
    const groups = [];
    shown.forEach(p => { let g = groups.find(x => x.name === p.group); if (!g) groups.push(g = { name: p.group, items: [] }); g.items.push(p); });
    nav.innerHTML = groups.map(g => '<div class="navgroup"><h4>' + esc(g.name) + "</h4>" +
      g.items.map(p => '<a href="#' + p.id + '" data-id="' + p.id + '"><span class="n">' + String(p.n).padStart(2, "0") + "</span><span>" + esc(p.title) + "</span></a>").join("") + "</div>").join("")
      || '<p class="empty">No page mentions “' + esc(filter) + '”.</p>';
    markActive();
  }
  let current = pages[0].id;
  function markActive(){ nav.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.id === current)); }

  function show(id, scroll){
    const i = Math.max(0, pages.findIndex(p => p.id === id));
    const p = pages[i]; current = p.id;
    page.innerHTML = '<div class="crumb">' + esc(p.group) + " · " + p.n + " of " + pages.length + "</div><h1>" + esc(p.title) + "</h1>";
    page.appendChild(p.tpl.content.cloneNode(true));
    page.querySelectorAll("pre.code").forEach(pre => {
      const raw = pre.textContent.replace(/^\n/, "");
      pre.innerHTML = "<code>" + hl(raw) + "</code>";
      const wrap = document.createElement("div"); wrap.className = "block";
      pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
      const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = "Copy";
      b.addEventListener("click", () => {
        const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); };
        try { navigator.clipboard.writeText(raw).then(done, () => selectText(pre, b)); } catch (e) { selectText(pre, b); }
      });
      wrap.appendChild(b);
    });
    const prev = pages[i - 1], next = pages[i + 1];
    const pg = document.createElement("div"); pg.className = "pager";
    pg.innerHTML = (prev ? '<a class="prev" href="#' + prev.id + '"><small>Previous</small>' + esc(prev.title) + "</a>" : "") +
                   (next ? '<a class="next" href="#' + next.id + '"><small>Next</small>' + esc(next.title) + "</a>" : "");
    page.appendChild(pg);
    page.style.animation = "none"; void page.offsetWidth; page.style.animation = "";
    markActive();
    if (scroll) window.scrollTo(0, 0);
    try { localStorage.setItem("mfg-page", p.id); } catch (e) {}
  }
  function selectText(el, b){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Press Ctrl+C"; setTimeout(() => b.textContent = "Copy", 1800); }

  function route(scroll){
    const h = location.hash.slice(1);
    let id = pages.some(p => p.id === h) ? h : null;
    if (!id) { try { const s = localStorage.getItem("mfg-page"); if (pages.some(p => p.id === s)) id = s; } catch (e) {} }
    show(id || pages[0].id, scroll);
  }
  nav.addEventListener("click", e => {
    const a = e.target.closest("a[data-id]"); if (!a) return;
    e.preventDefault(); location.hash = a.dataset.id;
    if (window.matchMedia("(max-width:860px)").matches) { side.classList.add("closed"); toggle.setAttribute("aria-expanded", "false"); }
  });
  page.addEventListener("click", e => { const a = e.target.closest(".pager a"); if (!a) return; e.preventDefault(); location.hash = a.getAttribute("href").slice(1); });
  window.addEventListener("hashchange", () => route(true));
  q.addEventListener("input", () => buildNav(q.value));
  toggle.addEventListener("click", () => { const open = side.classList.toggle("closed") === false; toggle.setAttribute("aria-expanded", String(open)); });
  if (!window.matchMedia("(max-width:860px)").matches) side.classList.remove("closed");
  buildNav("");
  route(false);
})();
</script>

</body></html>
